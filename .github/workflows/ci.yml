name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      # MuJoCo is needed by the pippin-mujoco backend and the validation suite
      - run: uv venv && uv pip install maturin mujoco numpy
      - run: cargo test --release --workspace --exclude pippin-py
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
      - run: uv run maturin develop --release
      - run: uv run python validation/compare_mujoco.py
